name: Build WEB FLOW APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o WEB_FLOW_ANDROID_SOURCE_AND_CLOUD_BUILD.zip

      - name: Build APK
        working-directory: WEB_FLOW_ANDROID
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WEB-FLOW-APK
          path: WEB_FLOW_ANDROID/app/build/outputs/apk/debug/app-debug.apk
